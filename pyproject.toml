[project]
name = "taskich"
version = "0.1.0"
description = "Менеджер задач и проектов с FastAPI и Jinja2"
readme = "README.md"
authors = [
    { name = "sayhelloartemka", email = "107796896+SweetSt@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
taskich = "taskich.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
